name: release

# Publishes to npm when a version tag is pushed, then creates the matching
# GitHub release: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  # Creates the GitHub release.
  contents: write
  # Lets npm verify this workflow (trusted publishing) and sign the provenance statement.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Trusted publishing: npm exchanges this job's OIDC token (`id-token: write`)
      # for a short-lived publish token, so no npm token is stored. `prepublishOnly`
      # builds again; `publishConfig` sets public access and provenance.
      - run: npm publish
      # Notes list the commits since the previous tag; edit them on GitHub afterwards.
      # Skipped when the release already exists, so a rerun doesn't fail.
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
